  <!-- DOM Patches: applied after React renders -->
  <script>
    (function () {
      var patched = { scrollIndicator: false, leadershipLink: false, heroCta: false };

      function applyPatches() {
        // Patch 1: Scroll indicator — hide on first scroll
        if (!patched.scrollIndicator) {
          var bounceEl = document.querySelector('.animate-bounce');
          if (bounceEl) {
            var wrapper = bounceEl.closest('.flex.justify-center');
            if (wrapper) {
              wrapper.classList.add('ionward-scroll-indicator');
              window.addEventListener('scroll', function () {
                wrapper.classList.add('hidden');
              }, { once: true, passive: true });
              patched.scrollIndicator = true;
            }
          }
        }

        // Patch 2: Remove "Meet our Leadership Team" link
        if (!patched.leadershipLink) {
          var allLinks = document.querySelectorAll('a');
          for (var i = 0; i < allLinks.length; i++) {
            if (allLinks[i].textContent.trim() === 'Meet our Leadership Team \u2192') {
              allLinks[i].style.display = 'none';
              patched.leadershipLink = true;
              break;
            }
          }
        }

        // Patch 3: Hero CTA — "Hire Tech Cloud" → "Hire a Developer in 48hrs"
        if (!patched.heroCta) {
          var anchors = document.querySelectorAll('a[href="#cloud"]');
          for (var j = 0; j < anchors.length; j++) {
            var nodes = anchors[j].childNodes;
            for (var k = 0; k < nodes.length; k++) {
              if (nodes[k].nodeType === 3 && nodes[k].textContent.indexOf('Hire Tech Cloud') !== -1) {
                nodes[k].textContent = 'Hire a Developer in 48hrs ';
                patched.heroCta = true;
                break;
              }
            }
          }
        }

        return patched.scrollIndicator && patched.leadershipLink && patched.heroCta;
      }

      // Observe DOM until React has rendered all patches
      var observer = new MutationObserver(function () {
        if (applyPatches()) observer.disconnect();
      });

      document.addEventListener('DOMContentLoaded', function () {
        applyPatches();
        observer.observe(document.body, { childList: true, subtree: true });
        setTimeout(function () { observer.disconnect(); }, 8000);
      });
    })();
  </script>
