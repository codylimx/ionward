    <!-- Tailwind Config for Custom Colors and Animations -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              ion: {
                DEFAULT: '#008988', // Based on the teal logo provided
                light: '#26A69A',
                dark: '#00695C',
                bg: '#F8FAFC',
              },
              slate: {
                850: '#1e293b', 
                900: '#0f172a',
                950: '#020617',
              }
            },
            animation: {
              'gradient-slow': 'gradient 15s ease infinite',
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scroll': 'scroll 40s linear infinite',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
            },
            keyframes: {
              gradient: {
                '0%, 100%': {
                  'background-size': '200% 200%',
                  'background-position': 'left center'
                },
                '50%': {
                  'background-size': '200% 200%',
                  'background-position': 'right center'
                },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              scroll: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              shimmer: {
                '100%': { transform: 'translateX(100%)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Smooth scrolling */
      html {

      }
      ::-webkit-scrollbar-thumb {

      ::-webkit-scrollbar-thumb:hover {

      }
      
      /* Custom utility for the subtle hero background */
      .hero-gradient {
        background: linear-gradient(-45deg, #020617, #0f2e2e, #1e293b, #113030);
        background-size: 300% 300%;
        animation: hero-gradient-animation 30s ease-in-out infinite alternate;
      }

      @keyframes hero-gradient-animation {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
    </style>
