  <!-- DOM Patches: applied after React renders -->
  <script>
    (function () {
      var patched = { scrollIndicator: false, leadershipLink: false, heroCta: false };

      function applyPatches() {
        // Patch 1: Scroll indicator — hide on first scroll
        if (!patched.scrollIndicator) {
          var bounceEl = document.querySelector('.animate-bounce');
          if (bounceEl) {
            var wrapper = bounceEl.closest('.flex.justify-center');
            if (wrapper) {
              wrapper.classList.add('ionward-scroll-indicator');
              window.addEventListener('scroll', function () {
                wrapper.classList.add('hidden');
              }, { once: true, passive: true });
              patched.scrollIndicator = true;
            }
          }
        }

        // Patch 2: Remove "Meet our Leadership Team" link
        if (!patched.leadershipLink) {
          var allLinks = document.querySelectorAll('a');
          for (var i = 0; i < allLinks.length; i++) {
            if (allLinks[i].textContent.trim() === 'Meet our Leadership Team \u2192') {
              allLinks[i].style.display = 'none';
              patched.leadershipLink = true;
              break;
            }
          }
        }

        // Patch 3: Hero CTA — "Hire Tech Cloud" → "Hire a Developer in 48hrs"
        if (!patched.heroCta) {
          var anchors = document.querySelectorAll('a[href="#cloud"]');
          for (var j = 0; j < anchors.length; j++) {
            var nodes = anchors[j].childNodes;
            for (var k = 0; k < nodes.length; k++) {
              if (nodes[k].nodeType === 3 && nodes[k].textContent.indexOf('Hire Tech Cloud') !== -1) {
                nodes[k].textContent = 'Hire a Developer in 48hrs ';
                patched.heroCta = true;
                break;
              }
            }
          }
        }

        return patched.scrollIndicator && patched.leadershipLink && patched.heroCta;
      }

      // Observe DOM until React has rendered all patches
      var observer = new MutationObserver(function () {
        if (applyPatches()) observer.disconnect();
      });

      document.addEventListener('DOMContentLoaded', function () {
        applyPatches();
        observer.observe(document.body, { childList: true, subtree: true });
        setTimeout(function () { observer.disconnect(); }, 8000);
      });
    })();
  </script>

  <!-- Inject: Legal footer links into React-rendered footer -->
  <script>
  (function () {
    var legalDone = false;

    function getUrls() {
      var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      return {
        privacy: isLocal ? '/privacy.html' : '/privacy',
        terms: isLocal ? '/terms.html' : '/terms'
      };
    }

    function patchReactFooterLinks() {
      var urls = getUrls();
      var buttons = document.querySelectorAll('footer button');
      for (var i = 0; i < buttons.length; i++) {
        var btn = buttons[i];
        var text = btn.textContent.trim();
        if (text === 'Privacy Policy') {
          (function (url) {
            btn.onclick = function (e) {
              e.preventDefault();
              e.stopPropagation();
              window.location.href = url;
            };
          })(urls.privacy);
        } else if (text === 'Terms of Service' || text === 'Terms & Conditions') {
          (function (url) {
            btn.onclick = function (e) {
              e.preventDefault();
              e.stopPropagation();
              window.location.href = url;
            };
          })(urls.terms);
        }
      }
    }

    function injectLegalLinks() {
      patchReactFooterLinks();

      if (legalDone || document.getElementById('ionward-legal-links')) return;

      // Look for the footer element or the last block with copyright text
      var footer = document.querySelector('footer') || document.querySelector('[class*="footer"]');
      if (!footer) {
        // Try finding copyright text as a fallback anchor
        var allEls = document.querySelectorAll('p, div, span');
        for (var i = allEls.length - 1; i >= 0; i--) {
          if (allEls[i].textContent.indexOf('IONWARD') !== -1 && allEls[i].textContent.indexOf('©') !== -1) {
            footer = allEls[i].closest('div, footer, section') || allEls[i].parentElement;
            break;
          }
        }
      }
      if (!footer) return;

      var urls = getUrls();
      var legalBar = document.createElement('div');
      legalBar.id = 'ionward-legal-links';
      legalBar.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:1.5rem;flex-wrap:wrap;padding:0.75rem 1.5rem;border-top:1px solid rgba(148,163,184,0.08);margin-top:0.5rem;';
      legalBar.innerHTML =
        '<a href="' + urls.privacy + '" style="color:#64748b;font-size:0.8125rem;text-decoration:none;font-family:\'Plus Jakarta Sans\',sans-serif;transition:color 0.2s;" onmouseover="this.style.color=\'#26A69A\'" onmouseout="this.style.color=\'#64748b\'">Privacy Policy</a>'
        + '<span style="color:#334155;font-size:0.75rem;">·</span>'
        + '<a href="' + urls.terms + '" style="color:#64748b;font-size:0.8125rem;text-decoration:none;font-family:\'Plus Jakarta Sans\',sans-serif;transition:color 0.2s;" onmouseover="this.style.color=\'#26A69A\'" onmouseout="this.style.color=\'#64748b\'">Terms &amp; Conditions</a>'
        + '<span style="color:#334155;font-size:0.75rem;">·</span>'
        + '<span style="color:#334155;font-size:0.8125rem;font-family:\'Plus Jakarta Sans\',sans-serif;">© 2026 IONWARD LTD. Singapore</span>';

      footer.appendChild(legalBar);
      legalDone = true;
    }

    var legalObs = new MutationObserver(function () { injectLegalLinks(); });
    document.addEventListener('DOMContentLoaded', function () {
      injectLegalLinks();
      legalObs.observe(document.body, { childList: true, subtree: true });
      setTimeout(function () { legalObs.disconnect(); }, 12000);
    });
  })();
  </script>
